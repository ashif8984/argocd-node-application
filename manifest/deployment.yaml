# Deployment file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: ashif8984/my-app:8edd0b69b3eac8e1e8ef6618e88d2216902d77bf
        ports:
        - containerPort: 3000