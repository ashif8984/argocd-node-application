# Deployment file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: ashif8984/my-app:5a23974dea4b45e43d5f6becf671bf24b70ca011
        ports:
        - containerPort: 3000